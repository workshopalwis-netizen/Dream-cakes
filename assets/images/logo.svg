    <path d="M46 14 Q48 14 48 12 Q48 14 50 14 Q48 14 48 16 Q48 14 46 14 Z" fill="#E28D7C"/>
  </g>
  <!-- Brand Typography -->
  <text x="74" y="38" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#241E1C">Dream Cakes</text>
  <text x="76" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="3.5" fill="#C59B63" text-transform="uppercase">Artisanal Patisserie</text>
</svg>
