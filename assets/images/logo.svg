    <path d="M16 25 H44 V36 H16 Z" fill="#FAF8F5" stroke="#241E1C" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="16" y1="31" x2="44" y2="31" stroke="#C59B63" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Top Tier -->
