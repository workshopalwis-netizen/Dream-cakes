    <!-- Pedestal Base -->
    <path d="M20 50 C24 46, 26 44, 28 38 L32 38 C34 44, 36 46, 40 50 Z" fill="#C59B63"/>
    <!-- Cake Plate -->
    <rect x="12" y="36" width="36" height="3" rx="1.5" fill="#241E1C"/>
